
{% extends "base.html" %}

{% block content %}
<div class="customers-page">

    <div class="detail-header">
        <div>
            <h1>Add New Customer</h1>
            <p>Enter customer information</p>
        </div>

        <a href="{% url 'customers_page' %}" class="back-btn">
            ← Back to Customers
        </a>
    </div>

    <div class="detail-card customer-form-card">

        <form method="POST" action="{% url 'add_customer' %}">
            {% csrf_token %}

            <div class="customer-form-grid">

                <div class="form-group">
                    <label for="name">Customer Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter customer name"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Mobile Number *</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gstin">GSTIN (Optional)</label>
                    <input
                        type="text"
                        id="gstin"
                        name="gstin"
                        placeholder="Enter 15-character GSTIN"
                        maxlength="15"
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter customer address"
                    ></textarea>
                </div>

            </div>

            <div class="customer-form-actions">
                <a href="{% url 'customers_page' %}" class="back-btn">
                    Cancel
                </a>

                <button type="submit" class="print-invoice-btn">
                    Save Customer
                </button>
            </div>

        </form>

    </div>
</div>
{% endblock %}
